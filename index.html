<script>
'use strict';
// =====================================================================

const $ = id => document.getElementById(id);

// ---------- настройки (хранятся только в этом браузере) ----------

// =====================================================================

// =====================================================================
const A = [['🐶','Собачка','dog','гав-гав'],['🐱','Кошечка','cat','мяу'],['🐸','Лягушка','frog','ква-ква'],['🐷','Хрюшка','pig','хрю-хрю'],['🐮','Коровка','cow','му-у'],['🦆','Уточка','duck','кря-кря'],['🐔','Курочка','hen','ко-ко-ко'],['🐥','Цыплёнок','chick','пи-пи-пи'],['🐑','Овечка','sheep','бе-е'],['🐴','Лошадка','horse','и-го-го'],['🦁','Лев','lion','р-р-р'],['🐻','Мишка','bear','р-р'],['🐰','Зайка','bunny'],['🦊','Лисичка','fox','тяф-тяф'],['🦉','Совушка','owl','ух-ух'],['🐭','Мышка','mouse','пи-пи'],['🐝','Пчёлка','bee','ж-ж-ж'],['🐘','Слоник','ele','ту-ту'],['🐯','Тигр','lion','р-р-р'],['🐵','Обезьянка','monkey','у-а-а'],['🐧','Пингвинчик','peng'],['🐓','Петушок','rooster','ку-ка-ре-ку'],['🐺','Волк','wolf','у-у-у'],['🦓','Зебра','horse'],['🐢','Черепашка'],['🦒','Жираф'],['🦔','Ёжик','hedge','фыр-фыр'],['🐞','Божья коровка'],['🦋','Бабочка'],['🦌','Оленёнок'],['🐐','Козочка','goat','ме-е'],['🐿️','Белочка'],['🐹','Хомячок','mouse'],['🦜','Попугай','parrot','привет']];
const F = [['🍎','Яблоко'],['🍌','Банан'],['🍊','Апельсин'],['🍐','Груша'],['🍓','Клубника'],['🍇','Виноград'],['🍉','Арбуз'],['🍑','Персик'],['🍍','Ананас'],['🥕','Морковка'],['🥦','Брокколи'],['🌽','Кукуруза'],['🍅','Помидор'],['🥒','Огурчик'],['🥔','Картошка'],['🍋','Лимон'],['🍒','Вишенка'],['🥝','Киви'],['🥭','Манго'],['🍈','Дыня'],['🥑','Авокадо'],['🍆','Баклажан'],['🥬','Капуста'],['🧅','Лук'],['🍄','Грибок'],['🥥','Кокос'],['🍏','Зелёное яблочко'],['~rasp','Малина'],['~bkb','Ежевика'],['~red','Красная смородина'],['~blk','Чёрная смородина'],['~goose','Крыжовник'],['~cran','Клюква'],['~blue','Черника']];

const SEA = [['🐠','Рыбка','bloop'],['🐡','Рыба-ёж','bloop'],['🐙','Осьминог','bloop'],['🦀','Краб','tick'],['🐚','Ракушка','bloop'],['🐳','Кит','whale'],['🐬','Дельфин','dolphin'],['🦈','Акула','bloop'],['🐢','Черепаха','bloop'],['🦞','Омар','tick'],['🦐','Креветка','bloop'],['🦭','Тюлень','seal'],['🐧','Пингвин','peng'],['🦑','Кальмар','bloop'],['~jelly','Медуза','bloop'],['~sstar','Морская звезда','bloop'],['🐟','Рыба','bloop']];
const CL = [['~orb0','Розовый'],['~orb1','Голубой'],['~orb2','Зелёный'],['~orb3','Жёлтый'],['~orb4','Фиолетовый'],['~orb5','Оранжевый']];
// цвет пузыря и его нота (До-пентатоника)
const P = [{ rgb: '255,138,158', m: 72 }, { rgb: '120,205,255', m: 74 }, { rgb: '135,230,180', m: 76 }, { rgb: '255,218,120', m: 79 }, { rgb: '195,160,255', m: 81 }, { rgb: '255,175,135', m: 84 }];
// режимы: мир, инструмент музыки, тональность, кого кормим
const MODES = [
  { ic: '🐶', name: 'Звери', d: A, snd: 1, world: 'meadow', inst: 'marimba', key: 0, out: 1 },
  { ic: '🍎', name: 'Фрукты и ягоды', d: F, snd: 0, world: 'garden', inst: 'harp', key: 2, out: 1, feed: ['🐰', '🐹', '🐿️', '🦔'] },
  { ic: '🧸', name: 'Игрушки', d: O, snd: 1, world: 'room', inst: 'musicbox', key: 5 },
  { ic: '🍞', name: 'Еда', d: FD, snd: 0, world: 'kitchen', inst: 'pizz', key: -2, feed: ['🐻', '🐶', '🐱', '🐼'] },
  { ic: '🚗', name: 'Транспорт', d: TR, snd: 1, world: 'road', inst: 'xylo', key: -5, out: 1 },
  { ic: '🐠', name: 'Море', d: SEA, snd: 1, world: 'sea', inst: 'glass', key: 4, water: 1 },
  { ic: '🎨', name: 'Цвета', d: CL, snd: 0, world: 'studio', inst: 'celesta', key: -3 }
];
const SEASON = (() => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; })();
const PRAISE = ['Молодец!', 'Ура!', 'Здорово!', 'Умничка!', 'Так держать!', 'Ой, как весело!'];

// =====================================================================
//  ЗВУК: общий тракт с компрессором и ограничителем
// =====================================================================
let ac = null, master, musBus, sfxBus, ambBus, voiceBus, noiseBuf, mus = null;
let ducked = false, rested = false, night = false, md = 0;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = .005; comp.release.value = .2;
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .08;
    master.connect(comp); comp.connect(lim); lim.connect(ac.destination);
    musBus = ac.createGain(); musBus.gain.value = 0; musBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = S.sfx; sfxBus.connect(master);
    ambBus = ac.createGain(); ambBus.gain.value = 0; ambBus.connect(master);
    voiceBus = ac.createGain(); voiceBus.gain.value = S.voice; voiceBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    loadSamples(); initMusic(); decodeRecs();
  }
  if (ac.state !== 'running' && !document.hidden) ac.resume();
  return ac;
}
// iOS: чтобы звук шёл даже при беззвучном режиме
let silentEl = null;
function unlockIOS() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!IOS) return;
  try {
    if (!silentEl) { silentEl = new Audio('data:audio/wav;base64,' + SILENT); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); }
    const p = silentEl.play(); if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
function tone(f, d, o) {
  o = o || {};
  const a = audio(), t = a.currentTime + (o.t || 0);
  const os = a.createOscillator(), fl = a.createBiquadFilter(), g = a.createGain();
  os.type = o.type || 'triangle';
  os.frequency.setValueAtTime(f[0], t);
  for (let i = 1; i < f.length; i++) os.frequency.exponentialRampToValueAtTime(Math.max(30, f[i]), t + d * i / (f.length - 1));
  let lfo, lg;
  if (o.vf) { lfo = a.createOscillator(); lg = a.createGain(); lfo.frequency.value = o.vf; lg.gain.value = o.vd || 20; lfo.connect(lg); lg.connect(os.frequency); lfo.start(t); lfo.stop(t + d + .05); }
  fl.type = o.ft || 'lowpass'; fl.frequency.value = o.ff || 2200; fl.Q.value = o.q || 1.5;

}
function noise(d, o) {
  o = o || {};
  const a = audio(), t = a.currentTime + (o.t || 0);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();

// ---------- подсказка-ладошка ----------
let hand = null, hintN = 0, hintClock = now();

}

//  РАСКЛАДКА И ГЛАВНЫЙ ЦИКЛ

function layout() {

let rt = 0;

addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
addEventListener('orientationchange', () => { clearTimeout(rt); rt = setTimeout(resize, 300); });

let t0 = now();
function loop(t) {
  const k = Math.min((t - t0) / 16.67, 3), dt = k / 60; t0 = t;
  windX *= Math.pow(.96, k); tiltX += (tiltRaw - tiltX) * .1 * k;
  ctx.drawImage(bgC, 0, 0, W, H);
  worldLive(t, k);
  if (started && !rested) { cd -= k; if (cd <= 0) { spawn(false); cd = 36; } }
  micTick(dt);
  // пузыри

    const b = bubbles[i];

  }

    ctx.save(); ctx.translate(q.x, q.y + q.dy * q.r * .9); ctx.scale(1 + w, 1 - w); ctx.drawImage(shl.c, -sz / 2, -sz / 2, sz, sz); ctx.restore();

}
