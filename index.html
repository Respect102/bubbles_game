html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#cbe8ff;font-family:'Nunito',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2c3e50}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;z-index:2;display:flex;align-items:center}
#top{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));justify-content:space-between;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#jar{width:60px;height:76px;display:block;flex:none}
#mid{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;pointer-events:none}
#gms{display:flex;gap:4px;padding:4px;border-radius:24px;background:rgba(255,255,255,.7);box-shadow:0 3px 10px rgba(0,0,0,.1);pointer-events:auto}
#gms button{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:20px;border:2px solid transparent;background:transparent;font:700 14px -apple-system,'Segoe UI',Roboto,sans-serif;color:#4a5568;transition:box-shadow .15s}
#gms button i{font-style:normal;font-size:20px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#gms button.on{background:#fff;border-color:#7a5af5;color:#2c3e50;box-shadow:0 2px 6px rgba(122,90,245,.3)}
#gms button.hold{box-shadow:0 0 0 7px rgba(255,138,160,.75);transition:box-shadow var(--hold,450ms) linear}
@media(max-width:560px){#gms button{width:50px;padding:0;justify-content:center;height:42px}#gms button span{display:none}#gms button i{font-size:22px}}
#hud{display:flex;justify-content:center;align-items:center;min-width:0;pointer-events:none}
#hud>*{pointer-events:auto}
@keyframes pin{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card{position:relative;width:78px;height:78px;border-radius:24px;border:3px solid #ffc83d;background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;padding:0;animation:pin .45s cubic-bezier(.3,1.6,.5,1)}
.card canvas{width:62px;height:62px;display:block}
.card .q{font-size:46px;font-weight:900;color:#9b6bff;line-height:1}
.card .spk{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:14px;background:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.25);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card.ok{border-color:#3ecf8e;box-shadow:0 0 0 5px rgba(62,207,142,.35)}
.catch{display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.88);border-radius:18px;padding:5px 12px 7px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.catch.hit{animation:shake .35s}
.catch .lv{font-size:12px;font-weight:800;color:#7a5af5}
.catch .hearts{font-size:17px;line-height:1.1;letter-spacing:1px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;white-space:nowrap}
.catch .pb{position:relative;width:118px;height:12px;border-radius:6px;background:#ffe3ea;overflow:hidden}
.catch .pb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff8aa0,#ffc83d);transition:width .3s}
.catch .pb b{position:absolute;inset:0;font-size:9px;line-height:12px;text-align:center;color:#5a4a70}
@keyframes pin{0%{transform:scale(.2)}100%{transform:scale(1)}}
.btn{width:52px;height:52px;border-radius:26px;border:2.5px solid rgba(120,160,200,.45);background:rgba(255,255,255,.88);box-shadow:0 4px 10px rgba(0,0,0,.12);font-size:24px;padding:0;cursor:pointer;color:#2c3e50;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:box-shadow .15s,transform .12s,opacity .2s}
.btn.hold{box-shadow:0 0 0 8px rgba(255,138,160,.75);transition:box-shadow var(--hold,900ms) linear}
#gear{width:44px;height:44px;font-size:19px;opacity:.5;flex:none}
#dn{flex:none;font-size:26px}
#aud{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 6px);display:flex;gap:8px;z-index:6}
#aud .btn{width:46px;height:46px;font-size:21px;position:relative}
#aud .btn.off{opacity:.85}
#musb.off::after{content:'';position:absolute;left:9px;right:9px;top:50%;height:4px;margin-top:-2px;background:#e8455a;border-radius:2px;transform:rotate(-45deg);box-shadow:0 0 0 1.5px #fff}
#modes{bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
#mbtn{width:80px;height:80px;border-radius:40px;border:0;padding:0;background:conic-gradient(from 20deg,#ff8aa0,#ffc83d,#8fe0b0,#7fc8ff,#c8a8ff,#ff8aa0);box-shadow:0 6px 18px rgba(60,80,130,.25);animation:wig 7s ease-in-out infinite}
#mbtn.hold{box-shadow:0 0 0 10px rgba(255,138,160,.75);animation:none}
#mbtn .in{position:absolute;inset:5px;border-radius:50%;background:#fff;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:9px 8px;font-size:20px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes wig{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg) scale(1.08)}92%{transform:rotate(10deg) scale(1.08)}95%{transform:rotate(-5deg)}}
#mpop .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:74px;border-radius:22px;border:2.5px solid rgba(120,160,200,.3);background:#fff;padding:0;color:#2c3e50;box-shadow:0 2px 6px rgba(0,0,0,.08)}
#mpop .tb i{font-style:normal;font-size:32px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#mpop .tb span{font:700 11px -apple-system,'Segoe UI',Roboto,sans-serif}
#mpop .tb.on{border-color:#ff8aa0;background:#fff4f7;box-shadow:0 0 0 3px rgba(255,138,160,.35)}
#mpop .tb:active{transform:scale(.93)}
#mpop{position:fixed;z-index:4;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 92px);transform:translateX(-50%) translateY(14px) scale(.85);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:10px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(40,60,100,.25);transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
#mpop.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#mpop .btn{width:54px;height:54px;font-size:27px}
#mpop .btn.on{border-color:#ff8aa0;box-shadow:0 0 0 3px rgba(255,138,160,.4)}
#mpop .gmrow{display:flex;gap:6px;justify-content:center;padding-bottom:8px;border-bottom:2px dashed #ffd1dc}
#mpop .gb{display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:60px;border-radius:18px;border:2.5px solid rgba(120,160,200,.35);background:#fff;font-size:24px;padding:0;color:#2c3e50;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#mpop .gb span{font:700 11px -apple-system,'Segoe UI',Roboto,sans-serif;margin-top:2px}
#mpop .gb.on{border-color:#7a5af5;box-shadow:0 0 0 3px rgba(122,90,245,.3)}
#mpop .grid{display:grid;gap:8px;justify-content:center}
